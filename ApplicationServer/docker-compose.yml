services:
  scada-postgres:
    image: postgres:14-alpine
    container_name: scada_database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    expose:
      - "5432"
    volumes:
      - scada_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  mqtt-listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
    container_name: scada_mqtt_listener
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../chirpstack-docker/configuration/certs/ca.pem:/certs/ca.pem:ro
    depends_on:
      - scada-postgres
    networks:
      - default
      - chirpstack_network

  scada-api:
    build: .
    container_name: scada_api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8005"
    depends_on:
      - scada-postgres
    networks:
      - default
      - scada_proxy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: scada_grafana
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-authentik-username
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_HEADERS=Name:X-authentik-name Email:X-authentik-email
      - GF_SERVER_ROOT_URL=http://grafana.localhost:8088
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - default
      - scada_proxy

volumes:
  scada_db_data:
  grafana_storage:

networks:
  scada_proxy:
    external: true
  chirpstack_network:
    external: true
    name: chirpstack-docker_default
