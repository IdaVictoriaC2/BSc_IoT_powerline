http:
  routers:
    authentik-outpost:
      rule: PathPrefix(`/outpost.goauthentik.io/`)
      entryPoints:
        - web
      priority: 100
      service: authentik-outpost

    protected:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      priority: 10
      middlewares:
        - authentik
      service: remote-app

  middlewares:
    authentik:
      forwardAuth:
        address: http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: "http://authentik-proxy:9000"

    remote-app:
      loadBalancer:
        servers:
          - url: "http://localhost:8080"