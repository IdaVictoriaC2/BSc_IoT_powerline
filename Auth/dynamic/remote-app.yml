http:
  routers:
    authentik-outpost:
      rule: PathPrefix(`/outpost.goauthentik.io/`)
      entryPoints:
        - web
      priority: 100
      service: authentik-outpost

    grafana:
      rule: Host(`grafana.localhost`)
      entryPoints:
        - web
      priority: 10
      middlewares:
        - authentik
      service: grafana

    scada-api:
      rule: Host(`api.localhost`)
      entryPoints:
        - web
      priority: 10
      middlewares:
        - authentik
      service: scada-api

    network-server:
      rule: Host(`chirpstack.localhost`)
      entryPoints:
        - web
      priority: 10
      middlewares:
        - authentik
      service: network-server

  middlewares:
    authentik:
      forwardAuth:
        address: http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: "http://authentik-proxy:9000"

    grafana:
      loadBalancer:
        servers:
          - url: "http://scada_grafana:3000"

    scada-api:
      loadBalancer:
        servers:
          - url: "http://scada_api:8005"

    network-server:
      loadBalancer:
        servers:
          - url: "http://chirpstack-docker_chirpstack_1:8080"
